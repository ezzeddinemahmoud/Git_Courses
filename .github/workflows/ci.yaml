name: "CI/CD z/OS - Build COBOL"
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-zos:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ✅ CORRIGÉ : Pas de cache npm
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Zowe CLI
      run: |
        npm install -g @zowe/cli@latest
        zowe --version

    - name: Setup Zowe config
      env:
        ZOS_USER: ${{ secrets.ZOS_USER }}
        ZOS_PASS: ${{ secrets.ZOS_PASS }}
      run: |
        cp zowe.config.json ./zowe.config.json
        zowe config set "profiles.global_base.secure.user" "$ZOS_USER" --global-config
        zowe config set "profiles.global_base.secure.password" "$ZOS_PASS" --global-config
        zowe config list --global-config

    - name: Test z/OSMF connection
      run: zowe zosmf info --zosmf-profile zosmf

    - name: Build COBOL
      run: |
        zowe zos-jobs submit local-file "jobs/compile.jcl" \
          --zosmf-profile zosmf \
          --wait-for-output
