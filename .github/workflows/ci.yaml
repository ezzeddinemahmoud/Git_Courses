name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read json.config
        run: |
          echo "APP_NAME=$(jq -r '.appName' json.config)" >> $GITHUB_ENV
          echo "NODE_VERSION=$(jq -r '.nodeVersion' json.config)" >> $GITHUB_ENV
          echo "BUILD_CMD=$(jq -r '.buildCommand' json.config)" >> $GITHUB_ENV
          echo "TEST_CMD=$(jq -r '.testCommand' json.config)" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: $BUILD_CMD

      - name: Test
        run: $TEST_CMD
