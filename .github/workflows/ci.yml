name: CI sur z/OS

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Zowe CLI
        run: npm install -g @zowe/cli

      - name: Tester l'installation
        run: zowe --version
