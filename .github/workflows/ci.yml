name: CI sur z/OS

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Zowe CLI
        run: npm install -g @zowe/cli

      - name: Configurer Zowe
        run: |
          zowe config auto-init \
            --host 204.90.115.200 \
            --port 10443 \
            --user Z82165 \
            --pass "PLA70OHR" \
            --reject-unauthorized false

      - name: Compiler CBL0000
        run: |
          echo "Soumission du JCL..."
          zowe zos-jobs submit local-file "./jcl/COMPILE.jcl" --wait-for-output
          echo "Compilation terminée"

      - name: Vérifier le résultat
        run: |
          echo "Load modules disponibles :"
          zowe zos-files list ds "Z82165.LOAD" --max-items 10
